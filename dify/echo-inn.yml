{
  "version": "0.1.5",
  "kind": "app",
  "app": {
    "name": "回声旅店",
    "mode": "workflow",
    "icon": "🏨",
    "icon_background": "#FFEAD5",
    "description": "有持久记忆的分支互动小说"
  },
  "workflow": {
    "environment_variables": [
      {
        "id": "game-token",
        "name": "GAME_TOKEN",
        "value": "",
        "value_type": "secret",
        "description": "后端令牌"
      }
    ],
    "conversation_variables": [],
    "features": {},
    "graph": {
      "nodes": [
        {
          "id": "start",
          "position": {
            "x": 0,
            "y": 0
          },
          "data": {
            "type": "start",
            "title": "玩家输入",
            "variables": [
              {
                "variable": "player",
                "label": "player",
                "type": "text-input",
                "required": true,
                "max_length": 64,
                "options": []
              },
              {
                "variable": "action",
                "label": "action",
                "type": "text-input",
                "required": true,
                "max_length": 200,
                "options": []
              },
              {
                "variable": "request_id",
                "label": "request_id",
                "type": "text-input",
                "required": true,
                "max_length": 64,
                "options": []
              }
            ]
          }
        },
        {
          "id": "http",
          "position": {
            "x": 300,
            "y": 0
          },
          "data": {
            "type": "http-request",
            "title": "读取记忆并推进剧情",
            "method": "post",
            "url": "http://host.docker.internal:18080/turn",
            "authorization": {
              "type": "no-auth",
              "config": null
            },
            "headers": "Content-Type: application/json\nAuthorization: Bearer {{#env.GAME_TOKEN#}}",
            "params": "",
            "body": {
              "type": "json",
              "data": [
                {
                  "id": "body",
                  "key": "",
                  "type": "text",
                  "value": "{\"player\": \"{{#start.player#}}\", \"action\": \"{{#start.action#}}\", \"request_id\": \"{{#start.request_id#}}\"}"
                }
              ]
            },
            "timeout": {
              "connect": 10,
              "read": 60,
              "write": 20
            },
            "variables": []
          }
        },
        {
          "id": "end",
          "position": {
            "x": 600,
            "y": 0
          },
          "data": {
            "type": "end",
            "title": "展示剧情",
            "outputs": [
              {
                "variable": "result",
                "value_selector": [
                  "http",
                  "body"
                ]
              }
            ]
          }
        }
      ],
      "edges": [
        {
          "id": "start-http",
          "source": "start",
          "target": "http",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "start",
            "targetType": "http-request"
          }
        },
        {
          "id": "http-end",
          "source": "http",
          "target": "end",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "http-request",
            "targetType": "end"
          }
        }
      ],
      "viewport": {
        "x": 0,
        "y": 0,
        "zoom": 1
      }
    }
  }
}