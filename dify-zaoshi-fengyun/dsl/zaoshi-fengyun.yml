      你想买 2 斤，兜里预算 **16 块**——想吃着黄瓜蘸酱，就得把价砍到 **8 元/斤以下**，否则只能闻味儿。

      老王抽了口烟，瞥你一眼：「瞅啥呢，买菜不？」

      👉 直接打字跟他过招。他有脾气、有底价、还记得你上一招使过啥。
      🕵 早市里流传着不少消息：邻摊报价、进货价、收摊清货时间、老主顾暗号……套出来一句，顶你砍三句。
